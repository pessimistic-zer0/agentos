# Default AgentOS policy for NixOS (preset `nix`).
# The only difference from fhs.toml is [sandbox].ro_mounts.
#
# For your own project, copy this file and change:
#   [filesystem] write   where the agent may write
#   [exec] allow         which commands it may run (each is arbitrary code, confined by the sandbox)
#   [sandbox] ro_mounts  add a virtualenv or another folder of packages (read-only in the sandbox)
#   [sandbox.env]        variables the commands need
# See "Using it on your own project" in the README.
policy_version = 1
name = "default-nix"

[filesystem]
# Paths are relative to the workspace root. `**` matches any number of folders.
read  = ["**"]
write = ["src/**", "tests/**", "**/__pycache__/**"]
# Denied paths are never copied into the workspace (D-008) and never opened.
deny  = [".env", ".env.*", "**/.env", "**/.env.*", "secrets/**", ".git/**", "**/*.pem", "**/id_rsa*"]
# Names the deny rules match but that hold no secrets (the template of a .env file).
deny_except = [".env.example", ".env.sample", ".env.template", "**/.env.example", "**/.env.sample", "**/.env.template"]
# Not copied into the workspace (big, and not needed there). For a virtualenv
# that is mounted in [sandbox] ro_mounts, put its folder here: skip = [".venv/**"]
skip = []
# Caches: commands may write here; it is not reported and not in the patch.
scratch = [".pytest_cache/**"]

[exec]
# argv prefixes. Arguments after the prefix are allowed and logged.
allow = [
  ["pytest"],
  ["python3", "-m", "pytest"],
]
# Programs the allowed commands start themselves, e.g. ["cc"] for `cargo test`
# (the linker) or ["sh"] for `npm test`. The agent cannot run them; this only
# puts their folder on the PATH that commands see.
helpers = []

[sandbox]
# Host folders the sandbox sees, read-only. On NixOS every program lives here.
ro_mounts = ["/nix/store"]

[sandbox.env]
# Extra environment variables for every command (fixed text). PATH, HOME and
# LANG are set by the runtime. This one stops Python writing compiled .pyc
# files next to the sources: a patch cannot carry them (D-090, D-092).
PYTHONDONTWRITEBYTECODE = "1"

[limits]
memory_mb      = 512
pids           = 128
cpu_percent    = 200
call_timeout_s = 60
max_output_kb  = 64
max_tool_calls = 50
