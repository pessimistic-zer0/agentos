[package]
name = "norn"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Runs a coding agent's tool calls under a policy, with a durable event log"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
sha2 = "0.10"
nix = { version = "0.31", features = ["fs", "dir", "mount", "sched", "process", "signal", "user"] }
landlock = "0.4"
libc = "0.2"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "fs_write"
harness = false

[profile.release]
debug = 1
