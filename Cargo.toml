[package]
name = "agentos"
version = "0.0.1"
edition = "2021"
rust-version = "1.89"
description = "Runs a coding agent's tool calls under a policy, with a durable event log"
publish = false

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
sha2 = "0.10"
nix = { version = "0.31", features = ["signal"] }
