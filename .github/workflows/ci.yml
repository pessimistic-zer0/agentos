# Runs the test suites with the `fhs` policy preset on Ubuntu.
#
# First green run: https://github.com/pessimistic-zer0/agentos/actions/runs/43385661105 (2026-11-13), the third
# run. The workflow itself never needed a change; the first two runs failed in
# the 200-kill step and found bugs B-007 and B-008 (docs/bugs.md). A commit is
# "not yet verified" on `fhs` until a run on it is green (D-027, D-072).
name: ci

on:
  push:
  pull_request:

jobs:
  fhs:
    runs-on: ubuntu-24.04
    env:
      AGENTOS_TEST_PRESET: fhs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install pytest and hyperfine
        run: sudo apt-get update && sudo apt-get install -y python3-pytest python3-venv hyperfine
      - name: Allow unprivileged user namespaces (Ubuntu 23.10+ restricts them through AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Start a systemd user session for the runner (needed for cgroup delegation)
        run: |
          sudo loginctl enable-linger "$(id -un)"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          sleep 3
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests (unit, vertical slice, security, benign, LLM mock, external tool, quick recovery)
        run: make test
      - name: Fault injection, 200 runs per cell (24 v0.1 cells, 8 external-call cells)
        run: make eval-recovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-report-fhs
          path: |
            target/recovery-report.json
            target/recovery-ext-report.json

  # The same sandbox, but with Ubuntu's restriction on user namespaces left
  # ON and agentos allowed through its own AppArmor profile
  # (packaging/apparmor/agentos, D-093). The job above switches the
  # restriction off for the whole machine instead. This job is separate so
  # that a problem with the profile cannot hide the result of the job above.
  fhs-apparmor:
    runs-on: ubuntu-24.04
    env:
      AGENTOS_TEST_PRESET: fhs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pytest
        run: sudo apt-get update && sudo apt-get install -y python3-pytest python3-venv
      - name: Start a systemd user session for the runner (needed for cgroup delegation)
        run: |
          sudo loginctl enable-linger "$(id -un)"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          sleep 3
      - name: Build
        run: cargo build && cargo test --no-run
      - name: Make sure the restriction is on
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          sudo aa-status | head -n 3
      - name: Without the profile agentos must refuse to start, and name the profile
        run: |
          if systemd-run --user --scope -q -p Delegate=yes target/debug/agentos --state-dir "$RUNNER_TEMP/state" run \
               --repo examples/demo-repo --policy policies/fhs.toml --script examples/scripts/fix-demo.toml 2> err.txt; then
            echo "agentos started although user namespaces are restricted and no profile is loaded"; exit 1
          fi
          cat err.txt
          grep -q "user namespaces cannot be used" err.txt
          grep -q "packaging/apparmor/agentos" err.txt
      - name: Install the profile for the binary under test
        run: |
          sed "s|/usr/local/bin/agentos|$PWD/target/debug/agentos|" packaging/apparmor/agentos | sudo tee /etc/apparmor.d/agentos > /dev/null
          sudo apparmor_parser -r /etc/apparmor.d/agentos
          sudo aa-status | grep agentos
      - name: The demo task, with the profile
        run: |
          systemd-run --user --scope -q -p Delegate=yes target/debug/agentos --state-dir "$RUNNER_TEMP/state" run \
            --repo examples/demo-repo --policy policies/fhs.toml --script examples/scripts/fix-demo.toml
      - name: Security, benign, vertical-slice and dependency suites, with the profile
        run: systemd-run --user --scope -q -p Delegate=yes cargo test --test vertical_slice --test security --test benign --test deps

