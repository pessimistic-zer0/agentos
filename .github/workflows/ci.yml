# Runs the test suites with the `fhs` policy preset on Ubuntu.
#
# First green run: https://github.com/pessimistic-zer0/agentos/actions/runs/43385661105 (2026-11-13), the third
# run. The workflow itself never needed a change; the first two runs failed in
# the 200-kill step and found bugs B-007 and B-008 (docs/bugs.md). A commit is
# "not yet verified" on `fhs` until a run on it is green (D-027, D-072).
name: ci

on:
  push:
  pull_request:

jobs:
  fhs:
    runs-on: ubuntu-24.04
    env:
      AGENTOS_TEST_PRESET: fhs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install pytest and hyperfine
        run: sudo apt-get update && sudo apt-get install -y python3-pytest python3-venv hyperfine
      - name: Allow unprivileged user namespaces (Ubuntu 23.10+ restricts them through AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Start a systemd user session for the runner (needed for cgroup delegation)
        run: |
          sudo loginctl enable-linger "$(id -un)"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          sleep 3
      - name: The system under test (kernel version, missing from earlier records)
        run: |
          . /etc/os-release && echo "system: $PRETTY_NAME"
          echo "kernel: $(uname -r)"
          echo "lsm: $(cat /sys/kernel/security/lsm)"
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests (unit, vertical slice, security, benign, LLM mock, external tool, quick recovery)
        run: make test
      - name: The demo from the README (fix, deliberate kill, recover, resume)
        run: make demo
      - name: Fault injection, 200 runs per cell (24 v0.1 cells, 8 external-call cells)
        run: make eval-recovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-report-fhs
          path: |
            target/recovery-report.json
            target/recovery-ext-report.json

  # The same sandbox, but with Ubuntu's restriction on user namespaces left
  # ON and agentos allowed through its own AppArmor profile
  # (packaging/apparmor/agentos, D-093). The job above switches the
  # restriction off for the whole machine instead. This job is separate so
  # that a problem with the profile cannot hide the result of the job above.
  fhs-apparmor:
    runs-on: ubuntu-24.04
    env:
      AGENTOS_TEST_PRESET: fhs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pytest
        run: sudo apt-get update && sudo apt-get install -y python3-pytest python3-venv
      - name: Start a systemd user session for the runner (needed for cgroup delegation)
        run: |
          sudo loginctl enable-linger "$(id -un)"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          sleep 3
      - name: Build
        run: cargo build && cargo test --no-run
      - name: Make sure the restriction is on
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          sudo aa-status | head -n 3
      - name: Without the profile agentos must refuse to start, and name the profile
        run: |
          if systemd-run --user --scope -q -p Delegate=yes target/debug/agentos --state-dir "$RUNNER_TEMP/state" run \
               --repo examples/demo-repo --policy policies/fhs.toml --script examples/scripts/fix-demo.toml 2> err.txt; then
            echo "agentos started although user namespaces are restricted and no profile is loaded"; exit 1
          fi
          cat err.txt
          grep -q "user namespaces cannot be used" err.txt
          grep -q "packaging/apparmor/agentos" err.txt
      - name: Install the program and the profile exactly as the README says, and run the demo task
        run: |
          sudo install -m 755 target/debug/agentos /usr/local/bin/agentos
          sudo install -m 644 packaging/apparmor/agentos /etc/apparmor.d/agentos
          sudo apparmor_parser -r /etc/apparmor.d/agentos
          systemd-run --user --scope -q -p Delegate=yes /usr/local/bin/agentos --state-dir "$RUNNER_TEMP/state-installed" run \
            --repo examples/demo-repo --policy policies/fhs.toml --script examples/scripts/fix-demo.toml
      - name: Install the profile for the binary under test
        run: |
          sed "s|/usr/local/bin/agentos|$PWD/target/debug/agentos|" packaging/apparmor/agentos | sudo tee /etc/apparmor.d/agentos > /dev/null
          sudo apparmor_parser -r /etc/apparmor.d/agentos
          sudo aa-status | grep agentos
      - name: The demo task, with the profile
        run: |
          systemd-run --user --scope -q -p Delegate=yes target/debug/agentos --state-dir "$RUNNER_TEMP/state" run \
            --repo examples/demo-repo --policy policies/fhs.toml --script examples/scripts/fix-demo.toml
      - name: Security, benign, vertical-slice and dependency suites, with the profile
        run: systemd-run --user --scope -q -p Delegate=yes cargo test --test vertical_slice --test security --test benign --test deps

  # The release as a user gets it (D-127): built with --release, packed by
  # packaging/release.sh, unpacked somewhere else and run from there. Then the
  # three benchmarks with the `fhs` preset. A shared CI machine is a poor
  # place to measure time: the numbers are kept as a record of this machine
  # (docs/results/bench-fhs), not as the project's figures.
  release:
    runs-on: ubuntu-24.04
    env:
      AGENTOS_TEST_PRESET: fhs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pytest and hyperfine
        run: sudo apt-get update && sudo apt-get install -y python3-pytest python3-venv hyperfine
      - name: Allow unprivileged user namespaces (the archive is run from a temporary folder, where the AppArmor profile does not apply)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Start a systemd user session for the runner (needed for cgroup delegation)
        run: |
          sudo loginctl enable-linger "$(id -un)"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          sleep 3
      - name: Build the release, pack it, and run the demo task from the unpacked archive
        run: packaging/release.sh --check
      - uses: actions/upload-artifact@v4
        with:
          name: agentos-release-x86_64-linux
          path: |
            target/dist/*.tar.gz
            target/dist/*.sha256
      - name: Benchmarks (sandbox spawn, fs.write, end to end)
        run: |
          make bench
          cat docs/results/bench-fhs/summary.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-fhs
          path: docs/results/bench-fhs

  # A second distribution (D-128): Debian 12, kernel 6.1, in a virtual
  # machine started from Debian's own cloud image. GitHub has no Debian
  # machines, and a container would share Ubuntu's kernel and give no
  # systemd user session. The job is separate so that a problem with the VM
  # cannot hide the Ubuntu jobs.
  debian:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Let the runner's user use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils
      - name: make test on Debian 12, as an ordinary user, with the fhs preset
        run: VM_CPUS=4 VM_MEM=8G ci/debian-vm.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debian-12-test-log
          path: |
            target/debian-vm/test.log
            target/debian-vm/console.log

