# Runs the test suites with the `fhs` policy preset on Ubuntu.
#
# First green run: https://github.com/pessimistic-zer0/agentos/actions/runs/43385661105 (2026-11-13), the third
# run. The workflow itself never needed a change; the first two runs failed in
# the 200-kill step and found bugs B-007 and B-008 (docs/bugs.md). A commit is
# "not yet verified" on `fhs` until a run on it is green (D-027, D-072).
name: ci

on:
  push:
  pull_request:

jobs:
  fhs:
    runs-on: ubuntu-24.04
    env:
      AGENTOS_TEST_PRESET: fhs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install pytest and hyperfine
        run: sudo apt-get update && sudo apt-get install -y python3-pytest hyperfine
      - name: Allow unprivileged user namespaces (Ubuntu 23.10+ restricts them through AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Start a systemd user session for the runner (needed for cgroup delegation)
        run: |
          sudo loginctl enable-linger "$(id -un)"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          sleep 3
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests (unit, vertical slice, security, benign, LLM mock, quick recovery)
        run: make test
      - name: Fault injection, 200 kills per cell
        run: make eval-recovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-report-fhs
          path: target/recovery-report.json
